[package]
name = "owlery"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Owlery"]
description = "Boîte de réception du développeur : PR à relire, CI en échec, mentions et tickets"

[lib]
path = "src/lib.rs"

[[bin]]
name = "owlery"
path = "src/main.rs"

[dependencies]
# Rendu glow uniquement, comme Fawkes et DragonTree.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard"] }
epaint = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = "4"
ureq = { version = "3", default-features = false, features = ["native-tls", "json", "gzip"] }
rfd = "0.17"
base64 = "0.23"
raw-window-handle = "0.6"
# Comptes communs de la suite EyrieSuite (dépôt voisin, voir `docs/contrat-local.md` §5).
suite-accounts = { path = "../SuperApp/crates/suite-accounts" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
