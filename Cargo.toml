[package]
name = "owlery"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Owlery"]
description = "Boîte de réception du développeur : PR à relire, CI en échec, mentions et tickets"

[lib]
path = "src/lib.rs"

[[bin]]
name = "owlery"
path = "src/main.rs"

[dependencies]
# Rendu glow uniquement, comme Fawkes et DragonTree.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard"] }
epaint = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = "4"
ureq = { version = "3", default-features = false, features = ["native-tls", "json", "gzip"] }
rfd = "0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
